[project]
name = "quanttool"
version = "0.1.0"
description = "A comprehensive quantitative trading platform for A-share stocks"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "QuantTool Team"}
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "pre-commit"
]
web = [
    "fastapi>=0.68.0",
    "uvicorn[standard]",
    "websockets"
]
analysis = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0"
]
data = [
    "tushare",
    "pyarrow>=6.0.0",
    "polars>=0.13.0"
]

[project.scripts]
quant = "quanttool.cli.main:app"