[project]
name = "quanttool"
version = "0.1.0"
description = "A comprehensive quantitative trading platform for A-share stocks"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "QuantTool Team"}
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "pydantic>=1.8.0",
    "pyyaml>=5.4.0",
    "typer>=0.4.0",
    "pytz>=2021.1",
    "scikit-learn>=1.0.0",
    "tushare>=1.2.0",
    "pyarrow>=6.0.0",
    "requests>=2.25.0",
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=1.4.0",
    "asyncpg>=0.28.0",
    "websockets>=10.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.0.0",
    "weasyprint>=53.0",
    "markdown>=3.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quanttool*"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "pre-commit"
]
web = [
    "fastapi>=0.68.0",
    "uvicorn[standard]",
    "websockets"
]
analysis = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0"
]
data = [
    "tushare",
    "pyarrow>=6.0.0",
    "polars>=0.13.0"
]
agent = [
    "mcp>=1.0.0",
]
qlib = [
    "pyqlib>=0.8.0",
]

[project.scripts]
quant = "quanttool.cli.main:app"
quanttool-mcp = "quanttool.agent.server:main"
