# Qlib LightGBM Workflow 配置
# 使用 qrun 命令运行: qrun workflow_lgb.yaml

# ============================================================================
# Qlib 初始化配置
# ============================================================================
qlib_init:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn

# ============================================================================
# 市场配置
# ============================================================================
market: &market all
instruments: &instruments all

# ============================================================================
# 时间配置
# ============================================================================
train_start: &train_start 2018-01-01
train_end: &train_end 2022-12-31
valid_start: &valid_start 2023-01-01
valid_end: &valid_end 2023-12-31
test_start: &test_start 2024-01-01
test_end: &test_end 2024-12-31

# ============================================================================
# 任务配置 - qrun 要求的结构
# ============================================================================
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.85
      learning_rate: 0.05
      max_depth: 8
      n_estimators: 500
      num_leaves: 127
      subsample: 0.85
      random_state: 42
      n_jobs: -1

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs:
          start_time: *train_start
          end_time: *test_end
          fit_start_time: *train_start
          fit_end_time: *train_end
          instruments: *instruments
      segments:
        train: [*train_start, *train_end]
        valid: [*valid_start, *valid_end]
        test: [*test_start, *test_end]

# ============================================================================
# 回测策略配置
# ============================================================================
strategy_config:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy
  kwargs:
    topk: 30
    n_drop: 5

# ============================================================================
# 回测执行器配置
# ============================================================================
executor_config:
  class: SimulatorExecutor
  module_path: qlib.backtest.executor
  kwargs:
    time_per_step: day
    generate_portfolio_metrics: true

# ============================================================================
# 回测配置
# ============================================================================
backtest_config:
  start_time: *test_start
  end_time: *test_end
  account: 1000000
  benchmark: &benchmark "SH000300"
  exchange_config:
    limit_threshold: 0.095
    deal_price: close

# ============================================================================
# 分析配置
# ============================================================================
analysis_config:
  class: Analysis
  module_path: qlib.workflow.analysis
  kwargs:
    metrics:
      - IC
      - Rank IC
